[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quantproof"
version = "0.2.0"
description = "Benchmark tool for local LLM developers to rank quant variants on their own tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "llm",
    "llama-cpp",
    "gguf",
    "quantization",
    "benchmark",
    "open-weights",
    "local-llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "huggingface_hub>=0.24",
    "openai>=1.40",
    "rich>=13.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
quantproof = "quantproof.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/quantproof"
Repository = "https://github.com/SuperMarioYL/quantproof"
Issues = "https://github.com/SuperMarioYL/quantproof/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quantproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
