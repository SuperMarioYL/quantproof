<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" data-palette="e65662-e7a26a-f6accd-8c8109a8ad20" role="img" aria-labelledby="qp-title qp-desc"><title id="qp-title">QuantProof calibration loop</title><desc id="qp-desc">Ranked table: variant | pass rate | Δ vs best | tok/s — with per-variant collapse flags and a per-task matrix.</desc><rect width="1000" height="470" rx="14" fill="#fef9fa"/><pattern id="qp-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#f7cbcf" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="1000" height="470" rx="14" fill="url(#qp-grid)"/><radialGradient id="qp-halo" cx="0.62" cy="0.42" r="0.75"><stop stop-color="#bf4852" stop-opacity="0.16"/><stop offset="1" stop-color="#fef9fa" stop-opacity="0"/></radialGradient><rect width="1000" height="470" rx="14" fill="url(#qp-halo)"/><linearGradient id="qp-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bf4852"/><stop offset="0.55" stop-color="#946744"/><stop offset="1" stop-color="#906478"/></linearGradient><marker id="qp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#bf4852" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.qp-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.qp-flow{animation:qp-flow 5.5s linear infinite}@keyframes qp-flow{to{stroke-dashoffset:-180}}.qp-pulse{animation:qp-pulse 4.2s ease-in-out infinite}@keyframes qp-pulse{0%,100%{opacity:.45}50%{opacity:1}}.qp-drift{animation:qp-drift 9s ease-in-out infinite}.qp-drift-slow{animation:qp-drift 16s ease-in-out infinite}@keyframes qp-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.qp-breathe{animation:qp-pulse 6.5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style><text x="48.0" y="46.0" fill="#725e6d" font-size="13" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">PROCESS / FROM PACK TO VERDICT</text><text x="48.0" y="82.0" fill="#27161d" font-size="30" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">The calibration loop, unattended</text><rect x="48.0" y="150.0" width="158.0" height="132.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="64.0" y="177.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">01  Load the pack</text><text x="64.0" y="204.0" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">tasks.json:</text><text x="64.0" y="223.6" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">prompts, graders,</text><text x="64.0" y="243.2" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">k samples per…</text><path d="M206 216H250" fill="none" stroke="#bf4852" stroke-width="1.6" marker-end="url(#qp-arrow)"/><rect x="254" y="140" width="698" height="162" rx="16" fill="none" stroke="#f7cbcf" stroke-dasharray="3 7"/><text x="268.0" y="162.0" fill="#725e6d" font-size="11.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">STEPS 2-5 REPEAT FOR EVERY VARIANT</text><rect x="268.0" y="172.0" width="157.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="284.0" y="199.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">02  Start llama-server</text><text x="284.0" y="226.0" fill="#725e6d" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">One child per</text><text x="284.0" y="244.1" fill="#725e6d" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">variant; wait for</text><text x="284.0" y="262.2" fill="#725e6d" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">/health.</text><path d="M425.0 228H439.0" fill="none" stroke="#bf4852" stroke-width="1.6" marker-end="url(#qp-arrow)"/><rect x="439.0" y="172.0" width="157.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="455.0" y="199.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">03  Draw k samples</text><text x="455.0" y="226.0" fill="#725e6d" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">/v1/chat/completions,</text><text x="455.0" y="244.1" fill="#725e6d" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">per task, per</text><text x="455.0" y="262.2" fill="#725e6d" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">sample.</text><path d="M596.0 228H610.0" fill="none" stroke="#bf4852" stroke-width="1.6" marker-end="url(#qp-arrow)"/><rect x="610.0" y="172.0" width="157.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="626.0" y="199.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">04  Grade deterministically</text><text x="626.0" y="226.0" fill="#725e6d" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Code: temp dir +</text><text x="626.0" y="244.1" fill="#725e6d" font-size="1