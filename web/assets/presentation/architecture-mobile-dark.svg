<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1146" viewBox="0 0 400 1146" data-palette="e65662-e7a26a-f6accd-8c8109a8ad20" role="img" aria-labelledby="qp-title qp-desc"><title id="qp-title">QuantProof architecture</title><desc id="qp-desc">One CLI, one llama-server child, state on disk</desc><rect width="400" height="1146" rx="14" fill="#0a070d"/><pattern id="qp-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#3a1820" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="400" height="1146" rx="14" fill="url(#qp-grid)"/><radialGradient id="qp-halo" cx="0.62" cy="0.42" r="0.75"><stop stop-color="#e65662" stop-opacity="0.16"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><rect width="400" height="1146" rx="14" fill="url(#qp-halo)"/><linearGradient id="qp-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e65662"/><stop offset="0.55" stop-color="#e7a26a"/><stop offset="1" stop-color="#f6accd"/></linearGradient><marker id="qp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e65662" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.qp-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.qp-flow{animation:qp-flow 5.5s linear infinite}@keyframes qp-flow{to{stroke-dashoffset:-180}}.qp-pulse{animation:qp-pulse 4.2s ease-in-out infinite}@keyframes qp-pulse{0%,100%{opacity:.45}50%{opacity:1}}.qp-drift{animation:qp-drift 9s ease-in-out infinite}.qp-drift-slow{animation:qp-drift 16s ease-in-out infinite}@keyframes qp-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.qp-breathe{animation:qp-pulse 6.5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style><text x="28.0" y="46.0" fill="#b29caa" font-size="13" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">ARCHITECTURE / DATA FLOW</text><text x="28.0" y="82.0" fill="#fdeef5" font-size="26" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">One CLI, one llama-server</text><text x="28.0" y="119.7" fill="#fdeef5" font-size="26" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">child, state on disk</text><rect x="28.0" y="130.0" width="344.0" height="92.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="44.0" y="157.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">tasks.json</text><text x="44.0" y="184.0" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">your prompts + graders</text><rect x="28.0" y="234.0" width="344.0" height="92.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="44.0" y="261.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">*.gguf</text><text x="44.0" y="288.0" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">the variants you already have</text><path d="M200 326V348" fill="none" stroke="#3a1820" stroke-width="2.2"/><path class="qp-flow" d="M200 326V348" fill="none" stroke="#e65662" stroke-width="1.6" stroke-dasharray="7 11"/><rect x="28.0" y="352.0" width="344.0" height="118.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="44.0" y="379.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">resolve</text><text x="44.0" y="406.0" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Local .gguf paths -&gt; variant labels + sizes.</text><path d="M200 470V494" fill="none" stroke="#3a1820" stroke-width="2.2"/><path class="qp-flow" d="M200 470V494" fill="none" stroke="#e65662" stroke-width="1.6" stroke-dasharray="7 11"/><rect x="28.0" y="494.0" width="344.0" height="118.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="44.0" y="521.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">runner</text><text x="44.0" y="548.0" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Spawns llama-server, waits /health, samples</text><text x="44.0" y="567.6" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">k per task.</text><rect x="70.0" y="620.0" width="260.0" height="96.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="86.0" y="647.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">llama-server child</text><text x="86.0" y="674.0" fill="#b29caa" font-size="13" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">one at a time: spawn -&gt; /health</text><text x="86.0" y="692.9" fill="#b29caa" font-size="13" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">-&gt; serve -&gt; terminate</text><path d="M200 612V620" fill="none" stroke="#3a1820" stroke-width="1.7999999999999998"/><path class="qp-flow" d="M200 612V620" fill="none" stroke="#e7a26a" stroke-width="1.2" stroke-dasharray="7 11"/><path d="M200 716V740" fill="none" stroke="#3a1820" stroke-width="2.2"/><path class="qp-flow" d="M200 716V740" fill="none" stroke="#e65662" stroke-width="1.6" stroke-dasharray="7 11"/><rect x="28.0" y="740.0" width="344.0" height="118.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="44.0" y="767.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">grader</text><text x="44.0" y="794.0" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Code block -&gt; temp dir + test_cmd; QA:</text><text x="44.0" y="813.6" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">substring.</text><path d="M200 858V882" fill="none" stroke="#3a1820" stroke-width="2.2"/><path class="qp-flow" d="M200 858V882" fill="none" stroke="#e65662" stroke-width="1.6" stroke-dasharray="7 11"/><rect x="28.0" y="882.0" width="344.0" height="118.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="44.0" y="909.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">report</text><text x="44.0" y="936.0" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Score, tok/s, per-task rates; collapse</text><text x="44.0" y="955.6" fill="#b29caa" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">deltas vs best.</text><rect x="28.0" y="1024.0" width="344.0" height="96.0" rx="12" fill="#131018" stroke="#3a1820"/><text x="44.0" y="1051.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">terminal</text><text x="44.0" y="1078.0" fill="#b29caa" font-size="13" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">ranked table + collapse flags</text></svg>
