name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test deps (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -ra
      - name: Smoke-test the CLI
        run: |
          quantproof --version
          quantproof --help
          quantproof doctor || test $? -eq 1   # llama-server absent on runners: expect the clear hint, exit 1
          quantproof init --dir /tmp/qp-smoke/tasks
          test -f /tmp/qp-smoke/tasks/tasks.json
