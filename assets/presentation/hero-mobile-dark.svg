<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" data-palette="e65662-e7a26a-f6accd-8c8109a8ad20" role="img" aria-labelledby="qp-title qp-desc"><title id="qp-title">QuantProof — ranked on your tasks</title><desc id="qp-desc">Illustrative pass-rate bars for quant variants with the collapse delta; illustrative motif; the recorded run ships as docs/demo-results.json</desc><rect width="400" height="500" rx="14" fill="#0a070d"/><pattern id="qp-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#3a1820" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="400" height="500" rx="14" fill="url(#qp-grid)"/><radialGradient id="qp-halo" cx="0.62" cy="0.42" r="0.75"><stop stop-color="#e65662" stop-opacity="0.16"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><rect width="400" height="500" rx="14" fill="url(#qp-halo)"/><linearGradient id="qp-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e65662"/><stop offset="0.55" stop-color="#e7a26a"/><stop offset="1" stop-color="#f6accd"/></linearGradient><marker id="qp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e65662" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.qp-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.qp-flow{animation:qp-flow 5.5s linear infinite}@keyframes qp-flow{to{stroke-dashoffset:-180}}.qp-pulse{animation:qp-pulse 4.2s ease-in-out infinite}@keyframes qp-pulse{0%,100%{opacity:.45}50%{opacity:1}}.qp-drift{animation:qp-drift 9s ease-in-out infinite}.qp-drift-slow{animation:qp-drift 16s ease-in-out infinite}@keyframes qp-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.qp-breathe{animation:qp-pulse 6.5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style><text x="30.0" y="52.0" fill="#b29caa" font-size="13" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">LOCAL QUANT CALIBRATION · MIT</text><text x="30" y="112" font-size="52.0" fill="url(#qp-brand)" font-weight="700" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">QuantProof</text><text x="30.0" y="156.0" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Every quant variant of one model,</text><text x="30.0" y="182.1" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">scored on your task pack — pass</text><text x="30.0" y="208.2" fill="#fdeef5" font-size="18" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">rate, tok/s and the collapse delta.</text><text x="34.0" y="212.0" fill="#b29caa" font-size="12.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">PASS RATE ON YOUR TASKS</text><text x="34.0" y="250.0" fill="#fdeef5" font-size="16" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Q4_K_M</text><text x="366.0" y="250.0" fill="#b29caa" font-size="13.5" text-anchor="end" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">baseline</text><rect x="34" y="262" width="332" height="12" rx="6" fill="#131018" stroke="#3a1820" stroke-width="0.7"/><rect class="qp-pulse" x="34" y="262" width="332.0" height="12" rx="6" fill="#e65662" opacity="0.8"/><text x="366.0" y="300.0" fill="#b29caa" font-size="13" text-anchor="end" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">100%</text><text x="34.0" y="326.0" fill="#fdeef5" font-size="16" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Q2_K</text><text x="366.0" y="326.0" fill="#b29caa" font-size="13.5" text-anchor="end" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">-28.0 pp</text><rect x="34" y="338" width="332" height="12" rx="6" fill="#131018" stroke="#3a1820" stroke-width="0.7"/><rect class="qp-pulse" x="34" y="338" width="239.0" height="12" rx="6" fill="#e65662" opacity="0.8"/><text x="366.0" y="376.0" fill="#b29caa" font-size="13" text-anchor="end" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">72%</text><text x="34.0" y="402.0" fill="#fdeef5" font-size="16" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">IQ2_XXS</text><text x="366.0" y="402.0" fill="#b29caa" font-size="13.5" text-anchor="end" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">-40.0 pp</text><rect x="34" y="414" width="332" height="12" rx="6" fill="#131018" stroke="#3a1820" stroke-width="0.7"/><rect class="qp-pulse" x="34" y="414" width="199.2" height="12" rx="6" fill="#e65662" opacity="0.8"/><text x="366.0" y="452.0" fill="#b29caa" font-size="13" text-anchor="end" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">60%</text></svg>
