<svg xmlns="http://www.w3.org/2000/svg" width="400" height="920" viewBox="0 0 400 920" data-palette="e65662-e7a26a-f6accd-8c8109a8ad20" role="img" aria-labelledby="qp-title qp-desc"><title id="qp-title">QuantProof calibration loop</title><desc id="qp-desc">Ranked table: variant | pass rate | Δ vs best | tok/s — with per-variant collapse flags and a per-task matrix.</desc><rect width="400" height="920" rx="14" fill="#fef9fa"/><pattern id="qp-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#f7cbcf" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="400" height="920" rx="14" fill="url(#qp-grid)"/><radialGradient id="qp-halo" cx="0.62" cy="0.42" r="0.75"><stop stop-color="#bf4852" stop-opacity="0.16"/><stop offset="1" stop-color="#fef9fa" stop-opacity="0"/></radialGradient><rect width="400" height="920" rx="14" fill="url(#qp-halo)"/><linearGradient id="qp-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bf4852"/><stop offset="0.55" stop-color="#946744"/><stop offset="1" stop-color="#906478"/></linearGradient><marker id="qp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#bf4852" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.qp-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.qp-flow{animation:qp-flow 5.5s linear infinite}@keyframes qp-flow{to{stroke-dashoffset:-180}}.qp-pulse{animation:qp-pulse 4.2s ease-in-out infinite}@keyframes qp-pulse{0%,100%{opacity:.45}50%{opacity:1}}.qp-drift{animation:qp-drift 9s ease-in-out infinite}.qp-drift-slow{animation:qp-drift 16s ease-in-out infinite}@keyframes qp-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.qp-breathe{animation:qp-pulse 6.5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style><text x="28.0" y="46.0" fill="#725e6d" font-size="13" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">PROCESS / FROM PACK TO VERDICT</text><text x="28.0" y="82.0" fill="#27161d" font-size="26" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">The calibration loop,</text><text x="28.0" y="119.7" fill="#27161d" font-size="26" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">unattended</text><rect x="28.0" y="128.0" width="344.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="44.0" y="155.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">01  Load the pack</text><text x="44.0" y="182.0" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">tasks.json: prompts, graders, k samples per</text><text x="44.0" y="201.6" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">task.</text><rect x="28.0" y="252.0" width="344.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="44.0" y="279.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">02  Start llama-server</text><text x="44.0" y="306.0" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">One child per variant; wait for /health.</text><path d="M200 364V384" fill="none" stroke="#f7cbcf" stroke-width="2.2"/><path class="qp-flow" d="M200 364V384" fill="none" stroke="#bf4852" stroke-width="1.6" stroke-dasharray="7 11"/><rect x="28.0" y="384.0" width="344.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="44.0" y="411.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">03  Draw k samples</text><text x="44.0" y="438.0" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">/v1/chat/completions, per task, per sample.</text><path d="M200 496V516" fill="none" stroke="#f7cbcf" stroke-width="2.2"/><path class="qp-flow" d="M200 496V516" fill="none" stroke="#bf4852" stroke-width="1.6" stroke-dasharray="7 11"/><rect x="28.0" y="516.0" width="344.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="44.0" y="543.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">04  Grade deterministically</text><text x="44.0" y="570.0" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Code: temp dir + test command. QA:</text><text x="44.0" y="589.6" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">substring.</text><path d="M200 628V648" fill="none" stroke="#f7cbcf" stroke-width="2.2"/><path class="qp-flow" d="M200 628V648" fill="none" stroke="#bf4852" stroke-width="1.6" stroke-dasharray="7 11"/><rect x="28.0" y="648.0" width="344.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="44.0" y="675.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">05  Swap the variant</text><text x="44.0" y="702.0" fill="#725e6d" font-size="13.5" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Terminate the server, load the next .gguf.</text><path d="M372 308H388V724H372" fill="none" stroke="#f7cbcf" stroke-width="1.7999999999999998"/><path class="qp-flow" d="M372 308H388V724H372" fill="none" stroke="#946744" stroke-width="1.2" stroke-dasharray="7 11"/><text x="200.0" y="774.0" fill="#725e6d" font-size="13" text-anchor="middle" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">steps 2-5 repeat for every variant</text><rect x="28.0" y="796.0" width="344.0" height="112.0" rx="12" fill="#fef7f7" stroke="#f7cbcf"/><text x="44.0" y="823.0" fill="#27161d" font-size="18" text-anchor="start" font-weight="600" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">result</text><text x="44.0" y="850.0" fill="#725e6d" font-size="14" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">Ranked table: variant | pass rate | Δ vs</text><text x="44.0" y="870.3" fill="#725e6d" font-size="14" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">best | tok/s — with per-variant collapse</text><text x="44.0" y="890.6" fill="#725e6d" font-size="14" text-anchor="start" font-weight="400" style="font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif">flags and a per-task matrix.</text></svg>
